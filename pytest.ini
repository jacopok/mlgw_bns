[pytest]
addopts = --doctest-modules --ignore=mlgw_bns/jax_predict.py
# without this, --doctest-modules picks up the scripts under `visualization/`
# and at the repo root, which are not tests and are not importable standalone.
# jax_predict.py is ignored because it unconditionally imports the optional
# `jax` extra, which is not installed by default, and has no doctests anyway.
testpaths = mlgw_bns tests
filterwarnings =
    # several tests deliberately cap max_iter well below convergence to
    # exercise other logic cheaply; the resulting untrained network is
    # expected and not itself something to warn about.
    ignore::sklearn.exceptions.ConvergenceWarning
