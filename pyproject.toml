[project]
name = "mlgw_bns"
version = "2.1.0"
description = "Accelerating gravitational wave template generation with machine learning."
license = "GPL-3.0-only"
authors = [
    { name = "Jacopo Tissino", email = "jacopo@tissino.it" },
]
keywords = ["python", "gravitational-waves", "scientific"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.2.3,<3", # for all kinds of array manipulation
    "optuna>=5.0.0,<6", # for optimization of hyperparameters
    "scipy>=1.16.3,<2", # interpolation, integration of the precession equations
    "scikit-learn==1.9.1", # provides the neural networks; pinned: the shipped regressors are pickled with it
    "h5py>=3.16.0,<4", # for management of h5 files
    "numba>=0.68.0", # acceleration of numerical computations
    "joblib>=1.6.0,<2", # to save pickled objects such as neural networks
    "tqdm>=4.70.1,<5", # makes progressbars
    "sortedcontainers>=2.4.0,<3", # for the management of index lists while downsampling
    "plotly>=6.8.0,<8", # to make plots for optuna studies
    "PyYAML>=6.0.2,<7",
    "dacite>=1.9.2,<2",
    "tqdm-joblib>=0.0.5",
]
 
[project.urls]
Homepage = "https://github.com/jacopok/mlgw_bns"
Repository = "https://github.com/jacopok/mlgw_bns"
 
[project.optional-dependencies]
docs = [
    "Sphinx>=8.1.3,<10", # myst-parser currently caps this at <10
    "sphinx-rtd-theme>=3.0.2",
    "readthedocs-sphinx-search>=0.3.2",
    "myst-parser>=5.1.0,<6",
    "MarkupSafe>=3.0.2",
    "sphinxcontrib-bibtex>=2.6.3",
    "sphinx-autodoc-defaultargs>=0.1.2",
]
torch = [
    "torch>=2.14.1,<3",
]
pycbc = [
    "pycbc>=2.11.0", # requires Python>=3.11
]
jax = [
    "jax>=0.7,<0.13", # experimental JAX port of the prediction inner loop
]

[dependency-groups]
dev = [
    "teobresums>=4.4.1",
    "pytest>=9.0.3",
    "black>=26.10.1",
    "pre-commit>=4.0.1",
    "mypy>=1.14.1",
    "types-PyYAML>=6.0.12",
    "ipython>=8.31.0",
    "pytest-benchmark>=5.1.0",
    "isort>=5.13.2",
    "pydeps>=3.0.1",
    "snakeviz>=2.2.2",
    "coveralls>=4.0.1",
    "matplotlib>=3.10.0",
    "optuna-dashboard>=0.21.0", # visualization/studies_dashboard.py
]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["mlgw_bns"]
# the regressors of the pretrained models are downloaded on first use
# (mlgw_bns/model_files.py), not shipped
exclude = ["mlgw_bns/data/*_nn.pkl"]

[tool.hatch.build.targets.sdist]
exclude = ["mlgw_bns/data/*_nn.pkl"]
 
[tool.isort]
profile = "black"

[tool.uv.sources]
# the fork's dali-precession-mlgw branch: upstream's Dali branch with its
# precession fixes (teobresums/teobresums PR #12), plus the fork's root-finder
# brackets (upstream aborts on some waveforms at small or very large Lambda)
# and the SPA start-of-band margin. Run with model = "Giotto".
teobresums = { git = "https://github.com/jacopok/teobresums", branch = "dali-precession-mlgw", subdirectory = "Python" }

