[project]
name = "mlgw_bns"
version = "0.12.1"
description = "Accelerating gravitational wave template generation with machine learning."
license = "GPL-3.0-only"
authors = [
    { name = "Jacopo Tissino", email = "jacopo@tissino.it" },
]
keywords = ["python", "gravitational-waves", "scientific"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.2.3,<3", # for all kinds of array manipulation
    "optuna>=4.9.0,<5", # for optimization of hyperparameters
    "scikit-learn>=1.9.0,<2", # provides the neural networks
    "h5py>=3.16.0,<4", # for management of h5 files
    "numba>=0.67.0", # acceleration of numerical computations
    "joblib>=1.5.3,<2", # to save pickled objects such as neural networks
    "tqdm>=4.67.1,<5", # makes progressbars
    "sortedcontainers>=2.4.0,<3", # for the management of index lists while downsampling
    "plotly>=6.8.0,<7", # to make plots for optuna studies
    "types-setuptools>=75.8.0", # technical
    "toml>=0.10.2,<0.11", # technical
    "PyYAML>=6.0.2,<7",
    "types-PyYAML>=6.0.12",
    "dacite>=1.9.2,<2",
    "pytest-cases>=3.10.1",
    "setuptools>=84.0.0",
    "tqdm-joblib>=0.0.5",
]
 
[project.urls]
Homepage = "https://github.com/jacopok/mlgw_bns"
Repository = "https://github.com/jacopok/mlgw_bns"
 
[project.optional-dependencies]
docs = [
    "Sphinx>=8.1.3,<9", # myst-parser currently caps this at <9
    "sphinx-rtd-theme>=3.0.2",
    "readthedocs-sphinx-search>=0.3.2",
    "myst-parser>=5.1.0,<6",
    "MarkupSafe>=3.0.2",
    "sphinxcontrib-bibtex>=2.6.3",
    "sphinx-autodoc-defaultargs>=0.1.2",
]
torch = [
    "torch>=2.12.0,<3",
]
pycbc = [
    "pycbc>=2.11.0", # requires Python>=3.11
]
 
[dependency-groups]
dev = [
    "teobresums>=4.4.1",
    "pytest<9",
    "tox>=4.23.2",
    "tox-uv>=1.16.0",
    "black>=26.5.1",
    "tox-gh-actions>=3.2.0",
    "pre-commit>=4.0.1",
    "mypy>=1.14.1",
    "virtualenv>=20.28.1",
    "ipython>=8.31.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "isort>=5.13.2",
    "pylint>=3.3.3",
    "pytest-cases>=3.8.6",
    "mutmut>=3.2.2",
    "scalene>=1.5.51",
    "pydeps>=3.0.1",
    "snakeviz>=2.2.2",
    "colorama>=0.4.6",
    "click>=8.1.8",
    "coveralls>=4.0.1",
    "pytest-profiling>=1.8.1",
    "matplotlib>=3.10.0",
]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["mlgw_bns"]
 
[tool.isort]
profile = "black"
